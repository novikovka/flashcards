<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки</title>
    <!-- Подключаем наш современный шрифт Onest -->
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Шапка приложения -->
    <header class="top-nav">
        <div class="logo">К</div>
        <h1>Карточки</h1>
    </header>

    <main class="container">
        <!-- ЭКРАН 1: СПИСОК КОЛОД -->
        <section id="decks-screen" class="screen active">
            <div class="screen-header">
                <div>
                    <h2>Мои колоды</h2>
                    <p id="decks-stats" class="stats-badge">Загрузка...</p>
                </div>
                <button id="btn-show-new-deck" class="btn-primary">+ Новая колода</button>
            </div>
            <div id="decks-grid" class="decks-grid">
                <!-- Карточки колод будут появляться здесь -->
            </div>
        </section>

        <!-- ЭКРАН 2: ВНУТРЕННОСТЬ КОЛОДЫ -->
        <section id="deck-screen" class="screen hidden">
            <button id="btn-back" class="btn-text">← Все колоды</button>
            
            <div class="screen-header">
                <h2 id="current-deck-name">Название колоды</h2>
                <p id="cards-stats" class="stats-badge">0 карточек</p>
            </div>

            <!-- Форма добавления карточки -->
            <form id="new-card-form" class="new-card-form">
                <h3>✨ Новая карточка</h3>
                <div class="form-row">
                    <input type="text" id="card-en" placeholder="Английский (слово или фраза)" required>
                    <input type="text" id="card-ru" placeholder="Перевод на русский" required>
                    <button type="submit" class="btn-primary">+ Добавить</button>
                </div>
            </form>

            <!-- Таблица слов -->
            <div class="cards-table-container">
                <table class="cards-table">
                    <thead>
                        <tr>
                            <th>АНГЛИЙСКИЙ</th>
                            <th>ПЕРЕВОД</th>
                            <th>ДЕЙСТВИЯ</th>
                        </tr>
                    </thead>
                    <tbody id="cards-list">
                        <!-- Слова будут появляться здесь -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Модальное окно: Новая колода -->
    <div id="modal-new-deck" class="modal hidden">
        <div class="modal-content">
            <h2>Новая колода</h2>
            <form id="new-deck-form">
                <label>НАЗВАНИЕ КОЛОДЫ</label>
                <input type="text" id="deck-name-input" placeholder="Например: Business English" required>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary close-modal">Отмена</button>
                    <button type="submit" class="btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Подтверждение удаления -->
    <div id="modal-delete" class="modal hidden">
        <div class="modal-content danger-modal">
            <h2 id="delete-title">Удалить колоду?</h2>
            <p>Отменить это действие нельзя.</p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary close-modal">Отмена</button>
                <button type="button" id="btn-confirm-delete" class="btn-danger">Удалить</button>
            </div>
        </div>
    </div>

    <!-- Скрипт с логикой (создадим на следующем шаге) -->
    <script src="app.js"></script>
</body>
</html>
